<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Categorías</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <header class="admin-header">
      <h1>Categorías</h1>
      <div>
        <a href="/" style="margin-right: 1rem">Ver blog</a>
        <a href="/admin.html">Volver a la lista de posts</a>
      </div>
    </header>

    <main class="admin-main">
      <form id="form-categoria">
        <label for="nombre">Nueva categoría</label>
        <input type="text" id="nombre" placeholder="Ej. Viajes" required />
        <button type="submit">Agregar</button>
      </form>
      <p id="mensaje"></p>

      <table id="tabla-categorias" style="margin-top: 1.5rem">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Slug</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla">
          <tr>
            <td colspan="3">Cargando...</td>
          </tr>
        </tbody>
      </table>
    </main>

    <script src="js/admin-categorias.js"></script>
  </body>
</html>
