<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="Mi Blog" />
    <meta
      property="og:description"
      content="Publicaciones sobre viajes, tecnología y más."
    />
    <meta
      property="og:image"
      content="https://collection.cloudinary.com/gb4lvqay/82467ad2107027c76d467be1d92c0706"
    />
    <meta
      property="og:url"
      content="https://blog-nodejs-production-c272.up.railway.app/"
    />
    <meta property="og:type" content="website" />
    <title>Admin - Blog de Alffa</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  </head>
  <body>
    <header class="admin-header">
      <h1>Panel de administración</h1>
      <div>
        <a href="/" style="margin-right: 1rem">Ver blog</a>
        <a href="/admin-categorias.html" style="margin-right: 1rem"
          >Categorías</a
        >
        <span id="nombre-usuario"></span>
        <button id="btn-logout">Cerrar sesión</button>
      </div>
    </header>

    <main class="admin-main">
      <a href="/admin-post.html" class="btn-nuevo">+ Nuevo post</a>
      <table id="tabla-posts">
        <thead>
          <tr>
            <th>Título</th>
            <th>Estado</th>
            <th>Visibilidad</th>
            <th>Fecha</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla">
          <tr>
            <td colspan="4">Cargando...</td>
          </tr>
        </tbody>
      </table>
    </main>

    <script src="js/admin.js"></script>
  </body>
</html>
